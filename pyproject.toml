[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "TopoStateGrid"
version = "1.1.1"
description = "TopoStateGrid is a physically informed graph construction method that converts power-grid topology, component attributes, and operating-state variables into machine-learning-ready graph datasets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "torch",
  "torch-geometric",
]

[tool.setuptools.packages.find]
include = ["topostategrid*"]

[project.optional-dependencies]
test = ["pytest"]
pandapower = ["pandapower"]
visual = ["matplotlib", "networkx", "pillow"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
